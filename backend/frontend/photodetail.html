<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Photo Detail</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <nav class="top-nav">
      <div class="logo">Team 13: Project 4</div>
      <div class="nav-links">
        <a href="index.html" class="public-link">Login</a>
        <a href="register.html" class="public-link">Register</a>
        <a href="gallery.html" class="private-link" style="display: none"
          >My Photos</a
        >
        <a href="upload.html" class="private-link" style="display: none"
          >Upload</a
        >
        <a href="search.html" class="private-link" style="display: none"
          >Search</a
        >
        <a href="#" id="logoutBtn" class="private-link" style="display: none"
          >Logout</a
        >
      </div>
    </nav>

    <div class="container">
      <h2 id="detail-name">Loading...</h2>
      <img
        id="detail-image"
        src=""
        alt="Photo Detail"
        style="width: 100%; border: 1px solid #ccc; margin-bottom: 15px"
      />
      <div
        style="
          text-align: left;
          background: #f9f9f9;
          padding: 15px;
          border: 1px solid #ccc;
        "
      >
        <strong>Description:</strong>
        <p id="detail-desc" style="margin-top: 5px"></p>
      </div>
      <button id="download-btn" style="margin-top: 20px">Download Photo</button>
      <button
        onclick="window.location.href = 'gallery.html'"
        style="background-color: #6c757d; margin-top: 10px"
      >
        Back to Gallery
      </button>
    </div>

    <script src="app.js"></script>
    <script>
      // Run the detail load function when this specific page opens
      if (typeof loadPhotoDetail === "function") {
        loadPhotoDetail();
      }
    </script>
  </body>
</html>
